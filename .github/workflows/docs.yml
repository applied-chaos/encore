name: Docs

on:
  push:
    branches: [develop]
    paths:
      - "site/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: cloudflare-pages
      url: https://pimusic.stream/
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT: encore
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      # Custom domains are attached to the project in the Cloudflare dashboard.
      - name: Ensure Pages project
        run: npx --yes wrangler@4 pages project list | grep -qw "$PROJECT" || npx --yes wrangler@4 pages project create "$PROJECT" --production-branch develop
      - run: npx --yes wrangler@4 pages deploy .vitepress/dist --project-name "$PROJECT" --branch develop
